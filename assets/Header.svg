    <text x="568" y="140" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">95.9%</text>
    <text x="32" y="196" font-size="21" font-weight="600" fill="#ffffff">Manuel Akanji</text>
    <text x="32" y="217" font-size="14" fill="#86efac" fill-opacity="0.75">CB  ·  84  ·  Manchester City</text>
    <rect x="352" y="182" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="352" y="182" width="78" height="10" rx="5" fill="url(#bar)"/>
    <text x="568" y="192" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">95.2%</text>
    <text x="32" y="248" font-size="21" font-weight="600" fill="#ffffff">Dávid Hancko</text>
    <text x="32" y="269" font-size="14" fill="#86efac" fill-opacity="0.75">CB  ·  81  ·  Feyenoord</text>
    <rect x="352" y="234" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="352" y="234" width="60" height="10" rx="5" fill="url(#bar)"/>
    <text x="568" y="244" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">94.0%</text>
    <text x="32" y="300" font-size="21" font-weight="600" fill="#ffffff">Nicolò Casale</text>
    <text x="32" y="321" font-size="14" fill="#86efac" fill-opacity="0.75">CB  ·  77  ·  Bologna</text>
    <rect x="352" y="286" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="352" y="286" width="59" height="10" rx="5" fill="url(#bar)"/>
    <text x="568" y="296" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">93.9%</text>
    <text x="32" y="352" font-size="21" font-weight="600" fill="#ffffff">Nathan Aké</text>
    <text x="32" y="373" font-size="14" fill="#86efac" fill-opacity="0.75">CB  ·  84  ·  Manchester City</text>
    <rect x="352" y="338" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="352" y="338" width="54" height="10" rx="5" fill="url(#bar)"/>
    <text x="568" y="348" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">93.6%</text>
