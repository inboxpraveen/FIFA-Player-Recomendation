    <text x="568" y="90" font-size="20" fill="#86efac" fill-opacity="0.75" text-anchor="end">CB  ·  89  ·  Liverpool</text>
    <line x1="32" y1="110" x2="568" y2="110" stroke="#065f46" stroke-width="2"/>
    <text x="32" y="144" font-size="21" font-weight="600" fill="#ffffff">Antonio Rüdiger</text>
    <text x="32" y="165" font-size="14" fill="#86efac" fill-opacity="0.75">CB  ·  88  ·  Real Madrid</text>
    <rect x="352" y="130" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
