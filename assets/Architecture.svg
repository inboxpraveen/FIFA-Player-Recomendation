<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100" role="img" aria-label="Architecture: an offline training script writes small model files that the Flask app loads and queries with one matrix-vector product per request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130d"/>
      <stop offset="1" stop-color="#0b2f23"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .h1 { font-size: 36px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 21px; fill: #6ee7b7; }
    .lane { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #6ee7b7; }
    .t { font-size: 25px; font-weight: 700; fill: #ffffff; }
    .b { font-size: 20px; fill: #cbd5e1; }
    .mono { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 18px; fill: #fde68a; }
    .tag { font-size: 18px; fill: #fbbf24; font-weight: 600; }
  </style>
  <rect width="1800" height="1100" fill="url(#bg)"/>

  <text class="h1" x="70" y="62">Architecture</text>
  <text class="sub" x="70" y="96">Train offline in under a second, then answer each query with one matrix-vector product</text>

  <rect x="40" y="120" width="1720" height="285" rx="22" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.5" stroke-width="2"/>
  <text class="lane" x="70" y="158">OFFLINE  /  training/train.py</text>
  <rect x="70" y="182" width="380" height="196" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="92" y="224">1  Load</text><text class="b" x="92" y="262">new-data/ FC 25 CSVs</text><text class="b" x="92" y="291">16,161 male rows</text><text class="b" x="92" y="320">1,576 female rows</text><rect x="496" y="182" width="380" height="196" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="518" y="224">2  Clean</text><text class="b" x="518" y="262">drop rows missing ratings,</text><text class="b" x="518" y="291">dedupe names, add a</text><text class="b" x="518" y="320">position category</text><rect x="922" y="182" width="380" height="196" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="944" y="224">3  Features</text><text class="b" x="944" y="262">35 numeric attributes,</text><text class="b" x="944" y="291">z-scored per column;</text><text class="b" x="944" y="320">mean and std kept</text><rect x="1348" y="182" width="380" height="196" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="1370" y="224">4  Save</text><text class="b" x="1370" y="262">joblib, compressed</text><text class="b" x="1370" y="291">male_model.pkl  1.9 MB</text><text class="b" x="1370" y="320">female_model.pkl  0.2 MB</text><line x1="456" y1="280" x2="490" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><line x1="882" y1="280" x2="916" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1308" y1="280" x2="1342" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="494" width="1720" height="340" rx="22" fill="#fbbf24" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="2"/>
  <text class="lane" x="70" y="532" style="fill:#fcd34d">ONLINE  /  python run.py  or  gunicorn app.main:app</text>
  <rect x="70" y="556" width="380" height="250" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="92" y="598">Browser</text><text class="b" x="92" y="636">Single page, vanilla JS</text><text class="b" x="92" y="665">Chart.js radar charts</text><text class="b" x="92" y="694">Light and dark themes</text><text class="b" x="92" y="723">Calls the JSON API</text><rect x="496" y="556" width="380" height="250" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="518" y="598">Flask  app/main.py</text><text class="mono" x="518" y="636">/api/search   /api/recommend</text><text class="mono" x="518" y="665">/api/compare  /api/player</text><text class="mono" x="518" y="694">/api/top-players  /api/stats</text><text class="mono" x="518" y="723">/api/autocomplete</text><rect x="922" y="556" width="380" height="250" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="944" y="598">PlayerRecommender</text><text class="b" x="944" y="636">1  resolve the name</text><text class="b" x="944" y="665">2  s = X·x / (|X| |x|)</text><text class="b" x="944" y="694">3  mask position and age</text><text class="b" x="944" y="723">4  argpartition top N</text><rect x="1348" y="556" width="380" height="250" rx="16" fill="#071d15" stroke="#10b981" stroke-width="2"/><text class="t" x="1370" y="598">In memory, per gender</text><text class="b" x="1370" y="636">X: n x 35 float32</text><text class="b" x="1370" y="665">row norms, player table</text><text class="b" x="1370" y="694">male 16,034  female 1,575</text><text class="b" x="1370" y="723">loaded once at import</text><line x1="456" y1="650" x2="490" y2="650" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)"/><line x1="490" y1="712" x2="456" y2="712" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)"/><line x1="882" y1="680" x2="916" y2="680" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1342" y1="680" x2="1308" y2="680" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1538.0" y1="384" x2="1538.0" y2="550" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)"/><text class="tag" x="1524.0" y="470" text-anchor="end">models/*.pkl</text>

  <rect x="70" y="880" width="1660" height="180" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#334155" stroke-width="1.5"/>
  <text class="b" x="100" y="930">One recommendation is a single 16,034 x 35 matrix-vector product: about 5 ms, no n x n matrix.</text><text class="b" x="100" y="970">Version 2.0 stored that matrix instead: 1.97 GB on disk and about 2.2 s per query.</text><text class="b" x="100" y="1010">Run with python run.py for development, or gunicorn and the Dockerfile in production.</text>
</svg>
