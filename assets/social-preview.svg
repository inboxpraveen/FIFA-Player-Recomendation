<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="FIFA Player Recommendation System: find similar football players with cosine similarity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130d"/>
      <stop offset="1" stop-color="#0b2f23"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="40" height="80" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#lines)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g transform="translate(866 176) scale(1.25)">
    <rect width="256" height="256" rx="56" fill="url(#mark)"/>
    <g fill="none" stroke="#ffffff" stroke-linejoin="round">
      <polygon points="128.0,46.0 204.2,90.0 204.2,178.0 128.0,222.0 51.8,178.0 51.8,90.0" stroke-opacity="0.45" stroke-width="5"/>
